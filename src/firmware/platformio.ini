; ============================================================
; SmartGrow 2.0 -- Firmware
; Fase 0 do roadmap: validar toolchain antes de mover logica.
; ============================================================

[platformio]
default_envs = esp32dev

; ------------------------------------------------------------
; Comum aos ambientes de hardware
; ------------------------------------------------------------
[env]
framework  = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Wall

; ------------------------------------------------------------
; ESP32 de producao / bancada
;
; ATENCAO: a versao da plataforma esta TRAVADA de proposito.
; A suspeita principal do bug HTTP -11 (ver docs/07-bugs-e-licoes.md
; secao C) foi o core ESP32 3.3.8. Nao atualizar sem testar o POST
; ao Apps Script em bancada primeiro.
; ------------------------------------------------------------
[env:esp32dev]
platform  = espressif32@6.9.0
board     = esp32dev
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit BME280 Library@^2.2.4
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    bblanchon/ArduinoJson@^7.0.4

; ------------------------------------------------------------
; Testes de logica pura, rodando no PC (sem ESP32 conectado).
;
; So modulos SEM dependencia de hardware podem ser testados aqui:
; Irrigation (decisao), Lighting (agendamento), Sensors (VPD e
; mapeamento), Gestures (maquina de estados).
;
;   pio test -e native
; ------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -std=c++17
    -DUNIT_TEST
    -Wall
lib_compat_mode = off
